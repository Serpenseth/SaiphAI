<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
                      script-src 'self' https://cdn.jsdelivr.net;
                      worker-src 'self' blob:;
                      style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
                      script-src-elem 'self' https://cdnjs.cloudflare.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
                      style-src-elem 'unsafe-inline' 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
                      font-src 'self' https://cdn.jsdelivr.net;
                      img-src 'self' https://ollama.com https://logos-world.net blob: ;"
    >
    <title>SaiphAI</title>
  </head>

  <body>
    <div id='intro-model-instructions' class="modal" style="content-visibility: hidden">
      <div id='modal-content' class="modal-content">
        <!-- Intro modals are loaded dynamically -->
      </div>
    </div>

    <div id='indexing-workspace-modal' class='secondary-modal' style='display: none'>
      <div id='index-workspace-dialog' class='modal-content-medium'>
        <h1 style='padding-top: 1rem'>
          Indexing workspace
        </h1>
        <p style='padding-top: 0.5rem'>
          Your workspace is stored on device
        </p>
        <p class="secondary-text" style='padding-top: 1rem; padding-bottom: 0.5rem'>
          This may take a while...
        </p>
        <canvas style='padding-top: 0.5rem' class="spinner"></canvas>
        <p id='indexing-text' style='padding-top: 2rem; padding-bottom: 0.5rem'>
        </p>
        </p>
      </div>
    </div>

    <div id='display-selected-files' class='secondary-modal' style='display: none'>
      <div id='expand-uploaded-contents'  class="modal-content-small">
      </div>
    </div>

    <div id="main-window-ui" style="content-visibility: hidden;">
      <div class="main-container">
        <div id='sidebar-container' class="sidebar-container">
          <div id="sidebar" class="sidebar">
            <div id="handle-sidebar" class="resizer-sidebar"></div>
            <div id='sidebar-actions' class="sidebar-actions">

            <button id="open-workspace" class="btn-icon sidebar-action-btn">
                <img style='height: 20px; width: 20px; margin-right: 7px;' src="../assets/folder.png">Open workspace
            </button>

            <button id="hide-sidebar" class="btn-icon sidebar-action-btn">
              <img style='height: 22px; width: 22px; margin-right: 7px;' src="../assets/close-sidebar.png">Hide Sidebar
            </button>

            <button id="show-sidebar" class="btn-icon sidebar-action-btn" title="Show sidebar" style="display: none">
              <img style='height: 22px; width: 22px;' src="../assets/open-sidebar.png">
            </button>

            <button id="build-toggle-btn" class="btn-icon sidebar-action-btn" style="display: none" title="Toggle Build Panel">
              <img style='height: 20px; width: 20px; margin-right: 7px;' src="../assets/build-icon.png">Build Project
            </button>

            <button id="btn-settings" class="btn-icon sidebar-action-btn" title="Settings" value="Settings">
              <img style='height: 20px; width: 20px; margin-right: 7px;' src="../assets/settings.png">
              <p id='settings-text'>Settings</p>
            </button>

            </div>
            <div id="file-tree" class="file-tree">
              <div id="sidebar-empty" class="empty-state">No workspace selected</div>
            </div>
          </div>

        </div>

        <div id='tabs-and-editor' class="content">
          <div id="file-tabs" class="tabs">
            <div class="tabRA active" style='display: none'>
              <p id="main-file-tab-title"></p>
              <button id="btn-close-file" class="tab-close" title="Close file">
              x
              </button>
            </div>
          </div>

          <div class="editor-container">
            <div class='floating-buttons' style='display: none'>
              <button id='explain-selection' class='floating-button-action explain'>
                Explain selection
              </button>
              <p style='padding: 0px 0.35rem;'>|</p>
              <button id='modify-with-ai' class='floating-button-action modify'>
                Modify with AI
              </button>
            </div>
          </div>

          <div class='floating-window' style='display: none'>
          </div>
       </div>

        <div id='ai-panel-and-tabs' class="editor-and-ai-panel-container">
          <div id="tabs-section" class="content-chat">
            <div id="chat-tabs" class="tabs">
            <!-- Chat tabs are added dynamically via ChatPanel.js -->
              <div>
                <button id="new-chat-tab" class="btn-primary new-tab-button" title="New chat tab">+</button>
              </div>
            </div>
          </div>

          <div class="ai-panel-container">
            <div id="ai-panel" class="ai-panel">
              <div id="handle" class="resizer"></div>
                <div id="chat-content" class="chat-history">
                  <div id='panel-msg' class='panel-msg'>
                    <p class='panel-text'>Your chats will appear here</p><br>
                    <p class='panel-text'>This panel has access to all your project files</p>
                    </div>
                </div>

                <div id="chat-input-area" class="chat-input-area">
                  <div id="handle-chat" class="resizer-chat"></div>

                  <div class="chat-file-container" style='display: none'>
                    <!-- Created dynamically via JS -->
                  </div>

                  <textarea
                    id="user-prompt"
                    class="chat-input"
                    spellcheck="false"
                    type="text"
                    placeholder="Ask AI..."
                  ></textarea>

                  <!-- Send chat/attach files -->
                  <div class="chat-action-container">
                    <!-- Attach file to prompt button -->
                    <button id="attach-file" class="chat-action attach-file-action" data-tooltip='Attach a file'>
                      <img style='height: 16px; width: 16px;' src='../assets/add-file.png'></img>
                    </button>
                    <p class='action-separator'> | </p>
                    <!-- Attach opened file to prompt button -->
                    <button
                      id="attach-opened-file"
                      class="chat-action attach-opened-file-action"
                      data-tooltip='Open a file through sidebar to attach a file to chat'
                      disabled>
                    @
                    </button>
                    <!-- Send prompt button -->
                    <button id="send-chat" class="chat-action send-action">
                      <img style='height: 16px; width: 16px;' src='../assets/send.png'></img>
                    </button>
                  </div>
                </div>

              </div>
            </div>
          </div>

            <div id="no-ai-panel">
              <button id="show-panel" class="btn-icon sidebar-action-btn" title="HIde ai chat panel" style="justify-content: center;">
                <img style='height: 16px; width: 16px;' src="../assets/open-sidebar.png">
              </button>
            </div>

            <div id="show-ai-panel" style='display: none'>
              <button id="hide-panel" class="btn-icon sidebar-action-btn" title="Show ai chat panel" style="justify-content: center;">
                <img style='height: 16px; width: 16px;' src="../assets/close-sidebar.png">
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="./globals.css">
    <link rel="stylesheet" href="./modals.css">
    <link rel="stylesheet" href="./buttons.css">
    <link rel="stylesheet" href="./sidebar.css">
    <link rel="stylesheet" href="./chat_panel.css">
    <link rel="stylesheet" href="./edit_file_area.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <!-- Renderer -->
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
