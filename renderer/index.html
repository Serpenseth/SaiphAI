<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' http://127.0.0.1:11434;
                      script-src 'self' https://cdn.jsdelivr.net;
                      worker-src 'self' blob:;
                      style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
                      script-src-elem 'self' https://cdnjs.cloudflare.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
                      style-src-elem 'unsafe-inline' 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
                      font-src 'self' https://cdn.jsdelivr.net;
                      img-src 'self' https://ollama.com https://logos-world.net blob: ;"
    >
    <title>SaiphAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="./globals.css">
    <link rel="stylesheet" href="./modals.css">
    <link rel="stylesheet" href="./buttons.css">
    <link rel="stylesheet" href="./sidebar.css">
    <link rel="stylesheet" href="./chat_panel.css">
    <link rel="stylesheet" href="./edit_file_area.css">
  </head>

  <body>
    <div id='intro-model-instructions' class="modal" style="content-visibility: hidden">
      <div id='modal-content' class="modal-content">
        <!-- Intro modals are loaded dynamically -->
      </div>
    </div>

    <div id='indexing-workspace-modal' class='secondary-modal' style='display: none'>
      <div id='index-workspace-dialog' class='modal-content-medium'>
        <h1 style='padding-top: 1rem'>
          Indexing workspace
        </h1>
        <p style='padding-top: 0.5rem'>
          Your workspace is stored on device
        </p>
        <p class="secondary-text" style='padding-top: 1rem; padding-bottom: 0.5rem'>
          This may take a while...
        </p>
        <canvas style='padding-top: 0.5rem' class="spinner"></canvas>
        <p id='indexing-text' style='padding-top: 2rem; padding-bottom: 0.5rem'>
        </p><br>
        <button id="abort-index-btn" class="btn btn-secondary modal-nav-button">
          Cancel
        </button>
      </div>
    </div>

    <div id='display-selected-files' class='secondary-modal' style='display: none'>
      <div id='expand-uploaded-contents'  class="modal-content-small">
      </div>
    </div>

    <div id='settings-modal' class='secondary-modal'>
    </div>

    <div id="update-available-modal" class='secondary-modal'>
    </div>

    <div id="main-window-ui" style="content-visibility: hidden;">
      <div class="main-container">
        <div id='sidebar-container' class="sidebar-container">
          <div id="sidebar" class="sidebar">
            <div id="handle-sidebar" class="resizer-sidebar"></div>
            <div id='sidebar-actions' class="sidebar-actions">

            <button id="open-workspace" class="sidebar-action-btn">
                <img width='20' height='20' style='margin-right: 5px;' src="../assets/folder.png">
                <p id='open-workspace-text'>Open workspace</p>
            </button>

            <button id='show-ai-panel-btn' class="sidebar-action-btn" title="Show ai panel">
              <img width='20' height='20' style='margin-right: 5px;' src="../assets/ai-panel-toggle.png">
                <p id='show-ai-panel-text'>Show AI Panel</p>
            </button>

            <button id="hide-sidebar" class="sidebar-action-btn">
              <img width='20' height='20' style='margin-right: 5px;' src="../assets/close-sidebar.png">Hide Sidebar
            </button>

            <button id="show-sidebar" class="sidebar-action-btn" title="Show sidebar" style="display: none">
              <img width='20' height='20' src="../assets/open-sidebar.png">
            </button>

            <button id="build-toggle-btn" class="sidebar-action-btn" style="display: none" title="Toggle Build Panel">
              <img width='20' height='20' style='margin-right: 5px;' src="../assets/build-icon.png">Build Project
            </button>

            <button id="btn-settings" class="sidebar-action-btn" title="Settings" value="Settings">
              <img width='20' height='20' style='margin-right: 5px;' src="../assets/settings.png">
              <p id='settings-text'>Settings</p>
            </button>

            </div>
            <div id="file-tree" class="file-tree">
              <div id="sidebar-empty" class="empty-state">No workspace selected</div>
            </div>
          </div>

        </div>

        <div id='tabs-and-editor' class="content">
          <div id="file-tabs" class="tabs">
          </div>

          <div class='floating-window' style='display: none'>
          </div>
        </div>

        <div id='ai-panel-and-tabs' class="editor-and-ai-panel-container">
          <div id="tabs-section" class="content-chat">
            <div id="chat-tabs" class="tabs">
            <!-- Chat tabs are added dynamically via ChatPanel.js -->
              <div>
                <button id="new-chat-tab" class="btn-primary new-tab-button" title="New chat tab">+</button>
              </div>
            </div>
          </div>

          <div class="ai-panel-container">
          </div>
        </div>

      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <!-- Renderer -->
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
